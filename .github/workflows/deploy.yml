name: Deploy SafeWork AI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno de despliegue"
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # nunca cancelar un deploy en curso

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/safework

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Tests y calidad
  # ─────────────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [api, ai-engine]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: safework_test
          POSTGRES_USER: safework
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        if: matrix.service == 'api' || matrix.service == 'ai-engine'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt

      - name: Install deps
        working-directory: services/${{ matrix.service }}
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          DATABASE_URL: postgresql://safework:testpassword@localhost:5432/safework_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-not-for-production-use
          ENCRYPTION_KEY: ${{ '0' * 64 }}
          ENVIRONMENT: test
        run: pytest --tb=short -q

  # ─────────────────────────────────────────────────────────────
  # 2. Build y push de imágenes Docker
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: services/api
          - service: ai-engine
            context: services/ai-engine
          - service: web
            context: apps/web
          - service: landing
            context: apps/landing

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # 3. Deploy a staging (automático en cada push a main)
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://staging.safework.es
    env:
      SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: deploy
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/safework

            # Actualizar imagen tag
            export IMAGE_TAG=${SHA::7}
            export REGISTRY=${{ env.REGISTRY }}

            # Pull nuevas imágenes
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull

            # Aplicar migraciones
            docker compose -f docker-compose.yml -f docker-compose.staging.yml \
              run --rm api alembic upgrade head

            # Rolling restart
            docker compose -f docker-compose.yml -f docker-compose.staging.yml \
              up -d --no-deps api ai-engine web landing

            # Smoke test
            sleep 10
            curl -sf https://staging.safework.es/health | grep '"status":"ok"'

      - name: Run E2E tests vs staging
        run: |
          echo "E2E tests (placeholder — añadir Playwright)"
          # npx playwright test --project=chromium

  # ─────────────────────────────────────────────────────────────
  # 4. Deploy a producción (manual, requiere aprobación)
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://safework.es

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: deploy
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/safework

            export IMAGE_TAG=${GITHUB_SHA::7}

            # Pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

            # Migraciones
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              run --rm api alembic upgrade head

            # Rolling restart sin downtime (réplica 1, luego 2)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --no-deps --scale api=1 api
            sleep 15
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --no-deps --scale api=2 api

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              up -d --no-deps ai-engine web landing

            # Smoke test producción
            sleep 10
            curl -sf https://safework.es/health | grep '"status":"ok"'

      - name: Notify deploy
        if: always()
        run: |
          echo "Deploy to production: ${{ job.status }}"
          # Añadir notificación Slack/email aquí
