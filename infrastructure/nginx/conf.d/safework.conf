# ============================================================
# SafeWork AI — Nginx hardening
# Requisitos: F12.3 CSP, HSTS, rate limiting, security headers
# ============================================================

# ── Rate limiting ─────────────────────────────────────────────────────────────
limit_req_zone  $binary_remote_addr zone=api_general:10m rate=60r/m;
limit_req_zone  $binary_remote_addr zone=api_auth:10m    rate=10r/m;
limit_req_zone  $binary_remote_addr zone=api_denuncia:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── Cabeceras de seguridad comunes ────────────────────────────────────────────
map $sent_http_content_type $csp_header {
    ~text/html "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.safework.es; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests";
    default    "";
}

# ── Upstream ──────────────────────────────────────────────────────────────────
upstream api_backend {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream ai_backend {
    server ai-engine:8001 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream web_backend {
    server web:3000;
    keepalive 32;
}

upstream landing_backend {
    server landing:4321;
    keepalive 16;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name safework.es www.safework.es app.safework.es;
    return 301 https://$host$request_uri;
}

# ── Landing (safework.es) ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name safework.es www.safework.es;

    ssl_certificate     /etc/nginx/ssl/safework.es.crt;
    ssl_certificate_key /etc/nginx/ssl/safework.es.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # HSTS con preload (F12.3.2)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Content-Type-Options   "nosniff"       always;
    add_header X-Frame-Options          "DENY"          always;
    add_header X-XSS-Protection         "0"             always;
    add_header Referrer-Policy          "no-referrer"   always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy  $csp_header     always;

    # Ocultar versión de servidor
    server_tokens off;

    root /var/www/landing;
    index index.html;

    # Caché agresiva para assets estáticos (Astro genera hashes en nombres)
    location ~* \.(js|css|woff2?|png|jpg|webp|avif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }

    location / {
        proxy_pass http://landing_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── App (app.safework.es) ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.safework.es;

    ssl_certificate     /etc/nginx/ssl/app.safework.es.crt;
    ssl_certificate_key /etc/nginx/ssl/app.safework.es.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL_APP:10m;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options   "nosniff"     always;
    add_header X-Frame-Options          "DENY"        always;
    add_header X-XSS-Protection         "0"           always;
    add_header Referrer-Policy          "no-referrer" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.safework.es wss://app.safework.es; frame-ancestors 'none'; base-uri 'self'" always;

    server_tokens off;
    limit_conn conn_limit 20;

    # Next.js app
    location / {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://web_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API Python — rate limiting diferenciado por endpoint sensible
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /api/v1/denuncias {
        limit_req zone=api_denuncia burst=3 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /api/v1/ {
        limit_req zone=api_general burst=30 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Sin IP en logs para endpoints de denuncia (privacidad)
    }

    # AI Engine — SSE streaming
    location /ai/ {
        limit_req zone=api_general burst=10 nodelay;
        proxy_pass http://ai_backend/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # SSE — desactivar buffering
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      3600s;
        add_header X-Accel-Buffering "no";
    }

    # Healthcheck — sin rate limit, sin logs
    location = /health {
        access_log off;
        proxy_pass http://api_backend/health;
    }
}
