global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: production
    service: safework-ai

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: safework-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: safework-ai-engine
    static_configs:
      - targets: ["ai-engine:8001"]
    metrics_path: /metrics

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
