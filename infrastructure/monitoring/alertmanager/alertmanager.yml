global:
  resolve_timeout: 5m
  smtp_from: alertas@safework.es
  smtp_smarthost: smtp.safework.es:587
  smtp_require_tls: true
  smtp_auth_username: alertas@safework.es
  smtp_auth_password: "${SMTP_PASSWORD}"

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 1h

receivers:
  - name: default
    email_configs:
      - to: ops@reker.es
        subject: "[SafeWork] {{ .GroupLabels.alertname }}"
        body: |
          {{ range .Alerts }}
          Alerta: {{ .Annotations.summary }}
          Descripción: {{ .Annotations.description }}
          Estado: {{ .Status }}
          {{ end }}

  - name: critical
    email_configs:
      - to: ops@reker.es,pablo@reker.es
        subject: "[SafeWork CRÍTICO] {{ .GroupLabels.alertname }}"
        body: |
          {{ range .Alerts }}
          ALERTA CRÍTICA: {{ .Annotations.summary }}
          Descripción: {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
