version: "3.9"

# ============================================================
# SafeWork AI — Docker Compose (base compartida)
# Usar con: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================================

services:
  # --- Base de datos PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: safework_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - safework_net

  # --- Redis (sesiones y caché) ---
  redis:
    image: redis:7-alpine
    container_name: safework_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - safework_net

  # --- Python FastAPI (API principal) ---
  api:
    build:
      context: ../../services/api
      dockerfile: Dockerfile
    container_name: safework_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      AI_ENGINE_URL: http://ai-engine:8001
      CASE_MGMT_URL: http://case-management:8080
      ALLOWED_ORIGINS: ${APP_URL},${LANDING_URL}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - safework_net

  # --- Python AI Engine ---
  ai-engine:
    build:
      context: ../../services/ai-engine
      dockerfile: Dockerfile
    container_name: safework_ai_engine
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_INTERNAL_URL: http://api:8000
    ports:
      - "${AI_ENGINE_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - safework_net

  # --- Java Spring Boot (Gestión de expedientes) ---
  case-management:
    build:
      context: ../../services/case-management
      dockerfile: Dockerfile
    container_name: safework_case_mgmt
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TSA_SERVER_URL: ${TSA_SERVER_URL:-https://freetsa.org/tsr}
    ports:
      - "${CASE_MGMT_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - safework_net

  # --- Next.js Web App ---
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: safework_web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
      NEXTAUTH_SECRET: ${JWT_SECRET}
      NEXTAUTH_URL: ${APP_URL}
      NEXT_PUBLIC_API_URL: ${APP_URL}/api/v1
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - safework_net

  # --- Astro Landing Page ---
  landing:
    build:
      context: ../../apps/landing
      dockerfile: Dockerfile
    container_name: safework_landing
    restart: unless-stopped
    environment:
      PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
    ports:
      - "4321:4321"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - safework_net

  # --- Nginx (reverse proxy) ---
  nginx:
    image: nginx:1.27-alpine
    container_name: safework_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      web:
        condition: service_healthy
      landing:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - safework_net

volumes:
  postgres_data:
  redis_data:
  nginx_logs:

networks:
  safework_net:
    driver: bridge
